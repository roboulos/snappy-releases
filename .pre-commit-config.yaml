# The gate's checks, run by the pre-commit framework (https://pre-commit.com) on every commit; enable once per clone with
# `git config core.hooksPath .githooks`. .github/workflows/snappy-releases-gate.yml runs the same tools directly, at the same
# versions, on the whole tree (and the STE100 linter, which publishes no pre-commit hook). Every rev is a full commit SHA, its release tag in the comment.
repos:
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7 # v1.32.0
    hooks:
      - id: zizmor
        # snappy-swift's threshold (scripts/gate/workflows.sh G-40), the same flags snappy-releases-gate runs.
        args: [--offline, --no-config, --no-ignores, --strict-collection, --persona, pedantic]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # v0.11.0.1 (ShellCheck 0.11.0)
    hooks:
      - id: shellcheck
        args: [--enable=all, -x]
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 479be5958357ba5ab65ce47172117348516860e9 # v3.14.1-1 (shfmt 3.14.1)
    hooks:
      - id: shfmt
        args: [--diff]
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      # The commit's own copy of CI's check: this hook reads the step "Full-tree hand-roll check" of
      # .github/workflows/handroll-review.yml with PyYAML and runs it as it is written. No detector is copied.
      - id: handroll-tree
        name: full-tree hand-roll check (the step of .github/workflows/handroll-review.yml, as CI runs it)
        language: python
        additional_dependencies: [pyyaml==6.0.3]
        entry: python -I -c
        args:
          - |
            import os, subprocess, sys, yaml
            steps = yaml.safe_load(open(".github/workflows/handroll-review.yml"))["jobs"]["handroll-review"]["steps"]
            step = next(s["run"] for s in steps if s.get("name") == "Full-tree hand-roll check")
            main = subprocess.run(["git", "rev-parse", "--quiet", "--verify", "origin/main"], capture_output=True)
            env = os.environ | {"BASE": "origin/main" if main.returncode == 0 else "", "GITHUB_REPOSITORY": "roboulos/snappy-releases"}
            sys.exit(subprocess.run(["bash", "-c", step], env=env).returncode)
        always_run: true
        pass_filenames: false
      - id: mergify-config
        name: mergify config validate
        language: python
        additional_dependencies: [mergify-cli==2026.11.17]
        entry: mergify config validate -f .mergify.yml
        files: ^\.mergify\.yml$
        pass_filenames: false
