# Landing queue for roboulos/snappy-releases: Mergify, same setup as snappy-lanes'.
# Required checks: snappy-releases-gate, release-check, handroll-review, release-gate.
# A pull request to main names its issue with Refs #N only (no closing keyword).
queue_rules:
  - name: default
    queue_conditions: &queue-and-merge
      - base=main
      - -draft
      - and: &required-checks
          - check-success=snappy-releases-gate
          - -check-failure=snappy-releases-gate
          - -check-pending=snappy-releases-gate
          - check-success=release-check
          - -check-failure=release-check
          - -check-pending=release-check
          - check-success=handroll-review
          - -check-failure=handroll-review
          - -check-pending=handroll-review
          - check-success=release-gate
          - -check-failure=release-gate
          - -check-pending=release-gate
      - -label=hold
    merge_conditions: *queue-and-merge
    merge_method: fast-forward
    commit_message_format:
      title: pr-title
      body: pr-body
    update_method: merge
    checks_timeout: 45 m
    batch_size: 4
    max_checks_retries: 0

priority_rules:
  - name: fix-main
    conditions:
      - label=fix-main
    priority: 5000
    allow_checks_interruption: true
  - name: now
    conditions:
      - label=now
    priority: high
    allow_checks_interruption: true
  - name: self-heal
    conditions:
      - label=self-heal
    priority: high
  - name: dependencies last
    conditions:
      - author=dependabot[bot]
    priority: low

pull_request_rules:
  - name: queue a ready pull request whose gate is green
    conditions: *queue-and-merge
    actions:
      queue:
        name: default

  - name: flag a pull request that conflicts with main
    conditions:
      - base=main
      - -closed
      - conflict
    actions:
      label:
        toggle:
          - conflict
      comment:
        message: >-
          This pull request conflicts with main, so the merge queue cannot take it.
          Merge origin/main into the branch (a merge, never a rebase), resolve, and
          push. The queue takes it once `snappy-releases-gate`, `release-check`,
          `handroll-review` and `release-gate` are green.

  - name: flag a pull request whose gate is red
    conditions:
      - base=main
      - -closed
      - -draft
      - or:
          - check-failure=snappy-releases-gate
          - check-failure=release-check
          - check-failure=handroll-review
          - check-failure=release-gate
    actions:
      label:
        toggle:
          - gate-red

merge_queue:
  skip_intermediate_results: true
  mode: serial
  max_parallel_checks: 6
  dequeued_label: dequeued

# Scopes from changed files, named for the checks this repository runs on a PR.
scopes:
  source:
    files:
      snappy-releases-gate:
        include:
          - .github/workflows/snappy-releases-gate.yml
          - .githooks/**
          - .pre-commit-config.yaml
          - .shellcheckrc
      release-check:
        include:
          - .github/workflows/release-check.yml
      handroll-review:
        include:
          - .github/workflows/handroll-review.yml
      release-gate:
        include:
          - .github/workflows/release-gate.yml
      release-promote:
        include:
          - .github/workflows/release-promote.yml
      docs:
        include:
          - "*.md"
          - "**/*.md"
      core:
        include:
          - "**/*"
        exclude:
          - .github/workflows/**
          - .githooks/**
          - .pre-commit-config.yaml
          - .shellcheckrc
          - "*.md"
          - "**/*.md"
          - .mergify.yml
  barrier_files:
    include:
      - .mergify.yml
      - .github/workflows/**
      - .githooks/**
      - .pre-commit-config.yaml
      - .shellcheckrc

merge_protections_settings:
  auto_merge_conditions: true
  post_comment: false

merge_protections:
  - name: no throwaway pull request lands
    if:
      - base=main
    success_conditions:
      - '-title~=(?i)^(tmp|wip|throwaway|do not merge)'
  - name: a major dependency bump needs a yes
    if:
      - author=dependabot[bot]
      - dependabot-update-type=version-update:semver-major
    success_conditions:
      - label=major-ok
  # Dependabot has no issue number, so it is exempt.
  - name: the pull request names its issue with Refs only
    if:
      - base=main
      - -author=dependabot[bot]
    success_conditions:
      - or:
          - "body~=Refs #[0-9]+"
          - "title~=Refs #[0-9]+"
      - '-body~=(?i)\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?):?\s*(?:[\w.-]+/[\w.-]+)?#[0-9]+'
      - '-body~=(?i)\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?):?\s*https?://\S+/issues/\d+'
      - '-title~=(?i)\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?):?\s*(?:[\w.-]+/[\w.-]+)?#[0-9]+'
      - '-title~=(?i)\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?):?\s*https?://\S+/issues/\d+'
