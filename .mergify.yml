# Landing queue for roboulos/snappy-releases: Mergify, the same setup as snappy-lanes' (and snappy-rust's and snappy-kernel's).
# Require `snappy-releases-gate`: the check .github/workflows/snappy-releases-gate.yml runs (release files only, actionlint,
# zizmor, bash -n, ShellCheck, shfmt, gitleaks, mergify config validate, the STE100 linter: published tools at exact pins) on a
# pull request's head and on Mergify's merge-queue draft pull requests. Every run must have passed (none failed, none pending).
# Require `release-check` too (.github/workflows/release-check.yml, every pull request): nothing lands while what this
# repository serves to users fails its check (roboulos/snappy-lanes#170).
# Require `handroll-review` too (.github/workflows/handroll-review.yml): the full-tree hand-roll check every Snappy
# repository holds. A hand-written protocol, a skip marker or a new exemption does not land.
# Require `release-gate` too (.github/workflows/release-gate.yml, every pull request): the latest release passes its Mac
# signature check and live smoke, and the two planted archives are refused (roboulos/snappy-releases#11).
# A pull request queues when it is ready, every required check is green and it is not held (label hold): no label is needed. A pull
# request labelled `now` goes to the front and may interrupt a lower priority check. A pull request labelled `self-heal`
# also goes to the front at high priority. A pull request to main names its issue with `Refs #N` or `Fixes #N`.
queue_rules:
  - name: default
    queue_conditions: &queue-and-merge
      - base=main
      - -draft
      # The required checks, written once (a YAML anchor) and named again for merge_conditions below.
      - and: &required-checks
          - check-success=snappy-releases-gate
          - -check-failure=snappy-releases-gate
          - -check-pending=snappy-releases-gate
          - check-success=release-check
          - -check-failure=release-check
          - -check-pending=release-check
          - check-success=handroll-review
          - -check-failure=handroll-review
          - -check-pending=handroll-review
          - check-success=release-gate
          - -check-failure=release-gate
          - -check-pending=release-gate
      - -label=hold
    merge_conditions: *queue-and-merge
    merge_method: squash
    # The squash commit on main reads the pull request's own title and body, never its first commit's message.
    commit_message_format:
      title: pr-title
      body: pr-body
    update_method: merge
    # A draft whose runner dies must not wait forever (snappy-lanes: 45 m, about 3x its slowest green queue check).
    checks_timeout: 45 m
    # Up to 4 pull requests share one speculative check. The queue starts earlier if the wait expires.
    batch_size: 4
    # A red queue check is run again once on a new draft before the pull request leaves the queue. Mergify has no
    # `retry_rules` key (its schema refuses it). This is its retry. `release-check` and `release-gate` read the live
    # release over the network, so one failed download does not dequeue a good batch. A real fault fails both runs.
    max_checks_retries: 1

priority_rules:
  - name: fix-main
    conditions:
      - label=fix-main
    priority: 5000
    allow_checks_interruption: true
  - name: now
    conditions:
      - label=now
    priority: high
    allow_checks_interruption: true
  - name: self-heal
    conditions:
      - label=self-heal
    priority: high
  - name: dependencies last
    conditions:
      - author=dependabot[bot]
    priority: low

pull_request_rules:
  - name: queue a ready pull request whose gate is green
    conditions: *queue-and-merge
    actions:
      queue:
        name: default

  # A pull request the queue cannot take must not sit unseen. The label toggles: it goes on while the condition holds and
  # comes off by itself once it is fixed. The same rules as snappy-lanes'.
  - name: flag a pull request that conflicts with main
    conditions:
      - base=main
      - -closed
      - conflict
    actions:
      label:
        toggle:
          - conflict
      comment:
        message: >-
          This pull request conflicts with main, so the merge queue cannot take it. Merge origin/main into the branch
          (a merge, never a rebase), resolve, and push; the queue takes it once `snappy-releases-gate`, `release-check`, `handroll-review` and `release-gate` are green.

  - name: flag a pull request whose gate is red
    conditions:
      - base=main
      - -closed
      - -draft
      - or:
          - check-failure=snappy-releases-gate
          - check-failure=release-check
          - check-failure=handroll-review
          - check-failure=release-gate
    actions:
      label:
        toggle:
          - gate-red

merge_queue:
  # A later batch pass stands in for an earlier batch tested on top of it when every scope in between was tested.
  skip_intermediate_results: true
  # Speculative checks stay in one train. Six of them can run at once.
  mode: serial
  max_parallel_checks: 6

# Scopes from changed files, named for the checks this repository runs on a pull request.
# `snappy-releases-gate` is that workflow, the commit hook, the tool pins and the ShellCheck config.
# `release-check` is the published-release digest workflow. `handroll-review` is the full-tree hand-roll workflow.
# `release-gate` is the Mac promotion workflow. `docs` is the prose. `core` is every other file, so every file has a lane.
# The queue config, a workflow, a hook, the tool pins or the ShellCheck config holds every scope until it lands.
scopes:
  source:
    files:
      snappy-releases-gate:
        include:
          - .github/workflows/snappy-releases-gate.yml
          - .githooks/**
          - .pre-commit-config.yaml
          - .shellcheckrc
      release-check:
        include:
          - .github/workflows/release-check.yml
      handroll-review:
        include:
          - .github/workflows/handroll-review.yml
      release-gate:
        include:
          - .github/workflows/release-gate.yml
      docs:
        include:
          - "*.md"
          - "**/*.md"
      core:
        include:
          - "**/*"
        exclude:
          - .github/workflows/**
          - .githooks/**
          - .pre-commit-config.yaml
          - .shellcheckrc
          - "*.md"
          - "**/*.md"
          - .mergify.yml
  barrier_files:
    include:
      - .mergify.yml
      - .github/workflows/**
      - .githooks/**
      - .pre-commit-config.yaml
      - .shellcheckrc

merge_protections_settings:
  auto_merge_conditions: true
  post_comment: false

merge_protections:
  - name: no throwaway pull request lands
    if:
      - base=main
    success_conditions:
      - -title~=(?i)^(tmp|wip|throwaway|do not merge)
  - name: a major dependency bump needs a yes
    if:
      - author=dependabot[bot]
      - dependabot-update-type=version-update:semver-major
    success_conditions:
      - label=major-ok
  # Dependabot has no issue number, so it is exempt. Any other pull request to main must name one.
  - name: the pull request names its issue with Refs or Fixes
    if:
      - base=main
      - -author=dependabot[bot]
    success_conditions:
      - or:
          - "body~=(?:Refs|Fixes) #[0-9]+"
          - "title~=(?:Refs|Fixes) #[0-9]+"
