name: release-gate
# Check a pre-release on Mac before it becomes latest.
# Verify signature, notarization, and daemon launch.
on:
  release:
    types: [prereleased]
  workflow_dispatch:
    inputs:
      tag:
        description: Pre-release to check (empty checks the latest)
        required: false
        type: string
  pull_request:
concurrency:
  group: >-
    release-gate-${{ github.event.pull_request.number
    || github.event.release.tag_name || inputs.tag
    || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  REPO: ${{ github.repository }}
  DIGESTS_QUERY: '[.assets[] | "\(.name)=\(.digest)"] | sort | join(" ")'
jobs:
  release-gate:
    name: release-gate
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.assets.outputs.tag }}
      digests: ${{ steps.assets.outputs.digests }}
    steps:
      - name: Download the uploaded archive
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
          ASKED: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          tag="${ASKED}"
          if [[ -z ${tag} ]]; then
            tag=$(gh release view -R "${REPO}" --json tagName --jq .tagName)
          fi
          re='^v[0-9]+\.[0-9]+\.[0-9]+$'
          [[ ${tag} =~ ${re} ]] || { echo "vMAJOR.MINOR.PATCH" >&2; exit 1; }
          name="Snappy-${tag#v}.zip"
          gh release download "${tag}" -R "${REPO}" -p "${name}" -D "${RUNNER_TEMP}/uploaded"
          digests=$(gh api "repos/${REPO}/releases/tags/${tag}" --jq "${DIGESTS_QUERY}")
          sum=$(shasum -a 256 "${RUNNER_TEMP}/uploaded/${name}" | cut -d' ' -f1)
          for asset in "${name}" Snappy.zip; do
            want="${asset}=sha256:${sum}"
            [[ " ${digests} " == *" ${want} "* ]] || { echo "${asset}" >&2; exit 1; }
          done
          printf 'tag=%s\ndigests=%s\n' "${tag}" "${digests}" >> "${GITHUB_OUTPUT}"
          printf 'ARCHIVE=%s\n' "${RUNNER_TEMP}/uploaded/${name}" >> "${GITHUB_ENV}"
      - name: Signature and live smoke
        env:
          TEAM: 7GZM62ZFML
          PORT: "39117"
        run: |
          set -euo pipefail
          work=$(mktemp -d "${RUNNER_TEMP}/gate.XXXXXX")
          daemon_pid='' app_pid=''
          stop() { [[ -n $1 ]] || return 0
            kill "$1" 2>/dev/null || true; wait "$1" 2>/dev/null || true; }
          trap 'stop "${app_pid}"; stop "${daemon_pid}"' EXIT
          swiftc -o "${work}/has-window" - <<'SWIFT'
          import CoreGraphics
          let pid = Int(CommandLine.arguments[1])!
          let w = CGWindowListCopyWindowInfo(
            [.optionOnScreenOnly], kCGNullWindowID
          ) as? [[String: Any]] ?? []
          let found = w.contains {
            $0[kCGWindowOwnerPID as String] as? Int == pid
            && $0[kCGWindowLayer as String] as? Int == 0
          }
          exit(found ? 0 : 1)
          SWIFT
          ours="=anchor apple generic and certificate leaf[subject.OU] = \"${TEAM}\""
          signature() {
            local app=$1 assessed
            codesign --verify --deep --strict --verbose=2 -R "${ours}" "${app}" &&
              assessed=$(spctl --assess --type execute --verbose=4 "${app}" 2>&1) &&
              printf '%s\n' "${assessed}" &&
              grep -Fxq 'source=Notarized Developer ID' <<< "${assessed}" &&
              xcrun stapler validate "${app}" &&
              codesign --verify --deep --strict --verbose=2 \
                -R "${ours}" "${app}/Contents/MacOS/snappyd" &&
              codesign --verify --strict --check-notarization \
                -R "=notarized" --verbose=2 "${app}/Contents/MacOS/snappyd"
          }
          daemon_answers() {
            local app=$1 home=$2 rev=$3 health=''
            local tok="${home}/.snappy-skills/daemon.token"
            local addr="${home}/.snappy-skills/daemon.addr"
            env -i HOME="${home}" TMPDIR="${home}" PATH=/usr/bin:/bin:/usr/sbin:/sbin \
              "${app}/Contents/MacOS/snappyd" --listen "127.0.0.1:${PORT}" \
              --token-file "${tok}" --address-file "${addr}" --profile desktop \
              > "${home}/snappyd.log" 2>&1 &
            daemon_pid=$!
            for ((try=0; try<300; try++)); do
              kill -0 "${daemon_pid}" 2>/dev/null || break
              if [[ -s ${tok} ]] &&
                health=$(curl -fsS -m 2 -H "Authorization: Bearer $(< "${tok}")" \
                  "http://127.0.0.1:${PORT}/health" 2>/dev/null) &&
                jq -e --argjson pid "${daemon_pid}" --arg revision "${rev}" \
                  '.ok and .pid == $pid and .revision == $revision
                  and (has("loading") | not)' <<< "${health}" > /dev/null
              then
                echo "ok snappyd ${daemon_pid}"
                return 0
              fi
              sleep 0.2
            done
            echo "FAIL snappyd" >&2
            tail -n 40 "${home}/snappyd.log"
            return 1
          }
          first_window() {
            local app=$1 home=$2
            env -i HOME="${home}" CFFIXED_USER_HOME="${home}" \
              TMPDIR="${home}" PATH=/usr/bin:/bin:/usr/sbin:/sbin \
              USER="${USER}" LOGNAME="${USER}" \
              "${app}/Contents/MacOS/Snappy" > "${home}/app.log" 2>&1 &
            app_pid=$!
            for ((try=0; try<60; try++)); do
              kill -0 "${app_pid}" 2>/dev/null || break
              if "${work}/has-window" "${app_pid}"; then
                echo "ok Snappy ${app_pid}"
                return 0
              fi
              sleep 1
            done
            echo "FAIL no window" >&2
            tail -n 40 "${home}/app.log"
            return 1
          }
          smoke() {
            local app=$1 home rev status=0
            home=$(mktemp -d "${work}/home.XXXXXX")
            mkdir "${home}/.snappy-skills"
            rev=$(plutil -extract SnappyPairedDaemonRevision raw \
              -o - "${app}/Contents/Info.plist") || return 1
            if daemon_answers "${app}" "${home}" "${rev}"; then
              stop "${daemon_pid}"
              daemon_answers "${app}" "${home}" "${rev}" &&
                first_window "${app}" "${home}" || status=1
            else
              status=1
            fi
            stop "${app_pid}"; stop "${daemon_pid}"
            app_pid='' daemon_pid=''
            return "${status}"
          }
          unpack() {
            local d; d=$(mktemp -d "${work}/unpacked.XXXXXX")
            ditto -x -k "$1" "${d}"; printf '%s\n' "${d}/Snappy.app"
          }
          pack() { ditto -c -k --sequesterRsrc --keepParent "$1" "$2"; }
          gates() {
            echo "== ${1##*/}"
            local app; app=$(unpack "$1"); refused=''
            for gate in signature smoke; do
              "${gate}" "${app}" || refused+=" ${gate}"
            done
            echo "${1##*/}:${refused:- none}"
          }
          must_refuse() {
            gates "$2"
            [[ " ${refused} " == *" $1 "* ]] || { echo "$1: ${2##*/}" >&2; exit 1; }
          }
          gates "${ARCHIVE}"
          [[ -z ${refused} ]] || { echo "refused:${refused}" >&2; exit 1; }
          app=$(unpack "${ARCHIVE}")
          target="${app}/Contents/Resources/McpAppsHost/host.js"
          cp "${target}" "${work}/original"
          perl -e '
            open my $f, "+<", $ARGV[0] or die;
            read $f, my $b, 1; seek $f, 0, 0;
            print {$f} chr(ord($b) ^ 1)
          ' "${target}"
          n=$({ cmp -l "${work}/original" "${target}" || true; } | wc -l)
          ((n == 1)) || { echo "${n} bytes not 1" >&2; exit 1; }
          pack "${app}" "${work}/one-byte.zip"
          must_refuse signature "${work}/one-byte.zip"
          app=$(unpack "${ARCHIVE}")
          printf '#!/bin/sh\nexit 1\n' > "${app}/Contents/MacOS/snappyd"
          pack "${app}" "${work}/daemon-exits.zip"
          must_refuse smoke "${work}/daemon-exits.zip"
