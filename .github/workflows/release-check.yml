name: release-check
# Checks what this repository serves to users after snappy-swift publishes a release:
# SHA-256 digests, GitHub asset digests, Sparkle 2 EdDSA signature, appcast.xml feed,
# Info.plist, the public download link, and every historical enclosure URL.
on:
  release:
    types: [published]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths: [.github/workflows/release-check.yml]
concurrency:
  group: release-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  release-check:
    name: release-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SPARKLE_PUBLIC_KEY: ReJxRjP2wnAv9vOzLPn7RAldkN9osfdLUxc0msqdDXA=
      FEED_URL: https://github.com/roboulos/snappy-releases/releases/latest/download/appcast.xml
      DOWNLOAD_URL: https://snappy.ai/download
    steps:
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: 0.13.9
          checksum: a7fbaff2b9a271d85c1bdb540941090fd1ce011797b4abeb48e4dcd39c2471d5
          enable-cache: false
      - name: Latest release assets and digests
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/release"
          mkdir -p "${work}" && cd "${work}"
          tag=$(gh release view -R "${REPO}" --json tagName --jq .tagName)
          version="${tag#v}"
          printf 'TAG=%s\nVERSION=%s\n' "${tag}" "${version}" >> "${GITHUB_ENV}"
          gh release download "${tag}" -R "${REPO}" \
            -p "Snappy-${version}.zip" -p "Snappy-${version}.zip.sha256" -p appcast.xml
          sha256sum -c "Snappy-${version}.zip.sha256"
          want="sha256:$(cut -d' ' -f1 "Snappy-${version}.zip.sha256")"
          digests=$(gh api "repos/${REPO}/releases/tags/${tag}" \
            --jq '.assets[] | "\(.name) \(.digest)"')
          for name in "Snappy-${version}.zip" Snappy.zip; do
            grep -Fxq "${name} ${want}" <<< "${digests}" \
              || { echo "${name}: not ${want}" >&2; exit 1; }
          done
          curl -fsSL --retry 3 "${FEED_URL}" | cmp - appcast.xml
      - name: Public download link ends at the latest Snappy.zip
        run: |
          set -euo pipefail
          headers="${RUNNER_TEMP}/download-headers"
          code=$(curl -sS -L --retry 3 -o /dev/null -D "${headers}" \
            -w '%{http_code}' "${DOWNLOAD_URL}")
          [[ ${code} == 200 ]] || { echo "${DOWNLOAD_URL} HTTP ${code}" >&2; exit 1; }
          hops=$(tr -d '\r' < "${headers}" | sed -n 's/^[Ll]ocation: //p')
          printf '%s\n' "${hops}"
          latest="https://github.com/${REPO}/releases/latest/download/Snappy.zip"
          tagged="https://github.com/${REPO}/releases/download/${TAG}/Snappy.zip"
          for want in "${latest}" "${tagged}"; do
            grep -Fxq "${want}" <<< "${hops}" \
              || { echo "not through ${want}" >&2; exit 1; }
          done
      - name: Appcast and app (Sparkle EdDSA signature, Info.plist, stapled ticket)
        working-directory: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          uv run --quiet --no-project --with 'cryptography==50.0.2' python - <<'PY'
          import base64, os, plistlib, sys, urllib.request, xml.etree.ElementTree as ET, zipfile
          from cryptography.exceptions import InvalidSignature
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey

          NS = "{http://www.andymatuschak.org/xml-namespaces/sparkle}"
          repo, tag, version = os.environ["REPO"], os.environ["TAG"], os.environ["VERSION"]
          key, feed = os.environ["SPARKLE_PUBLIC_KEY"], os.environ["FEED_URL"]
          archive = f"Snappy-{version}.zip"
          faults = []

          def check(ok, what):
              print(("ok   " if ok else "FAIL ") + what)
              if not ok:
                  faults.append(what)

          items = ET.parse("appcast.xml").getroot().findall("channel/item")
          newest = [i for i in items if i.findtext(f"{NS}shortVersionString") == version]
          check(len(newest) == 1, f"appcast.xml has one item for {version}")
          if not newest:
              sys.exit(1)
          item = newest[0]
          enclosure = item.find("enclosure")
          url = f"https://github.com/{repo}/releases/download/{tag}/{archive}"
          check(enclosure.get("url") == url, f"enclosure url is {url}")
          check(enclosure.get("length") == str(os.path.getsize(archive)),
                "enclosure length is the archive's size")
          sig = base64.b64decode(enclosure.get(f"{NS}edSignature", ""))
          try:
              pub = Ed25519PublicKey.from_public_bytes(base64.b64decode(key))
              pub.verify(sig, open(archive, "rb").read())
              check(True, "edSignature verifies against the pinned Sparkle public key")
          except (InvalidSignature, ValueError):
              check(False, "edSignature verifies against the pinned Sparkle public key")

          with zipfile.ZipFile(archive) as app:
              names = set(app.namelist())
              info = plistlib.loads(app.read("Snappy.app/Contents/Info.plist"))
          check(info.get("CFBundleShortVersionString") == version,
                f"Info.plist CFBundleShortVersionString is {version}")
          check(info.get("CFBundleVersion") == item.findtext(f"{NS}version"),
                "Info.plist CFBundleVersion is the appcast's sparkle:version")
          check(info.get("SUPublicEDKey") == key, "Info.plist SUPublicEDKey is the pinned key")
          check(info.get("SUFeedURL") == feed, f"Info.plist SUFeedURL is {feed}")
          cs = "Snappy.app/Contents"
          check(f"{cs}/_CodeSignature/CodeResources" in names, "the app carries its code signature")
          check(f"{cs}/CodeResources" in names, "the app carries a stapled notarization ticket")

          for other in items:
              link = other.find("enclosure").get("url")
              try:
                  req = urllib.request.Request(link, method="HEAD")
                  with urllib.request.urlopen(req, timeout=30) as ans:
                      check(ans.status == 200, f"{link} answers 200")
              except OSError as why:
                  check(False, f"{link} answers 200 ({why})")

          sys.exit(1 if faults else 0)
          PY
  alert:
    name: alert
    needs: release-check
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write # Open or update operator alert issue on failure.
    steps:
      - name: Open or update the alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="release-check failed: what Snappy releases serve needs a person"
          body="@${OWNER} release-check failed. Run: ${RUN_URL}"
          number=$(gh issue list -R "${REPO}" --state open --limit 200 --json number,title \
            | jq -r --arg title "${title}" '[.[] | select(.title == $title) | .number][0] // empty')
          if [[ -n ${number} ]]; then
            gh issue comment "${number}" -R "${REPO}" --body "${body}"
          else
            gh issue create -R "${REPO}" --title "${title}" --body "${body}" --assignee "${OWNER}"
          fi
