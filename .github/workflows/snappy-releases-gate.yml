name: snappy-releases-gate
# Lint gate: actionlint, zizmor, ShellCheck, shfmt, gitleaks, mergify validate, STE100,
# Refs #N, and repository rules. Same pins as .pre-commit-config.yaml.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
concurrency:
  group: snappy-releases-gate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  snappy-releases-gate:
    name: snappy-releases-gate
    if: >-
      github.event_name == 'push'
      || github.event.pull_request.draft == false
      || startsWith(github.head_ref, 'mergify/merge-queue/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ACTIONLINT: 1.7.12
      SHELLCHECK: 0.11.0
      SHFMT: 3.14.1
      ZIZMOR: 1.32.0
      GITLEAKS: 8.30.1
      MERGIFY_CLI: 2026.11.17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: 0.13.9
          checksum: a7fbaff2b9a271d85c1bdb540941090fd1ce011797b4abeb48e4dcd39c2471d5
          enable-cache: false
      - name: Tools (published releases, SHA-256 checked)
        run: |
          set -euo pipefail
          tools="${RUNNER_TEMP}/tools"
          mkdir -p "${tools}"
          fetch() {
            curl -fsSL --retry 3 -o "${tools}/$3" "$1"
            echo "$2  ${tools}/$3" | sha256sum -c -
          }
          gh="https://github.com"
          u="${gh}/rhysd/actionlint/releases/download/v${ACTIONLINT}"
          fetch "${u}/actionlint_${ACTIONLINT}_linux_amd64.tar.gz" \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 actionlint.tar.gz
          tar -xzf "${tools}/actionlint.tar.gz" -C "${tools}" actionlint
          u="${gh}/koalaman/shellcheck/releases/download/v${SHELLCHECK}"
          fetch "${u}/shellcheck-v${SHELLCHECK}.linux.x86_64.tar.xz" \
            8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 shellcheck.tar.xz
          tar -xJf "${tools}/shellcheck.tar.xz" -C "${tools}" --strip-components=1 \
            "shellcheck-v${SHELLCHECK}/shellcheck"
          u="${gh}/mvdan/sh/releases/download/v${SHFMT}"
          fetch "${u}/shfmt_v${SHFMT}_linux_amd64" \
            76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf shfmt
          chmod +x "${tools}/shfmt"
          u="${gh}/zizmorcore/zizmor/releases/download/v${ZIZMOR}"
          fetch "${u}/zizmor-x86_64-unknown-linux-gnu.tar.gz" \
            bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b zizmor.tar.gz
          tar -xzf "${tools}/zizmor.tar.gz" -C "${tools}" zizmor
          u="${gh}/gitleaks/gitleaks/releases/download/v${GITLEAKS}"
          fetch "${u}/gitleaks_${GITLEAKS}_linux_x64.tar.gz" \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb gitleaks.tar.gz
          tar -xzf "${tools}/gitleaks.tar.gz" -C "${tools}" gitleaks
          u="https://raw.githubusercontent.com/danyuchn/asd-ste100-skill"
          u+="/65c8ab6ef5fcb3619c8e6daca43e68627f3d7b4a/scripts/ste-lint.py"
          fetch "${u}" \
            66c454b94dea0f81334f36b222775b62b6ec24e25c0e62308f23c550ef3eaa3d ste-lint.py
      - name: Repository rules
        run: |
          set -euo pipefail
          status=0
          allowed='^(README[.]md|[.]mergify[.]yml|[.]pre-commit-config[.]yaml|[.]shellcheckrc'
          allowed+='|[.]githooks/pre-commit|[.]github/dependabot[.]yml'
          allowed+='|[.]github/workflows/[a-z-]+[.]yml)$'
          if extra=$(git ls-files | grep -Ev "${allowed}"); then
            printf 'not a release file:\n%s\n' "${extra}" >&2
            status=1
          fi
          while IFS= read -r -d '' f; do
            lines=$(wc -l < "${f}")
            max=300; [[ ${f} != *.yml ]] || max=200
            ((lines <= max)) || { echo "${f}: ${lines} lines (max ${max})" >&2; status=1; }
          done < <(git ls-files -z)
          suppress='#[[:space:]]*shellcheck[[:space:]]+[a-z]+='
          suppress+='|gitleaks:allow|zizmor:[[:space:]]*ignore'
          if hits=$(git grep -n -I -E "${suppress}" -- . \
            ':!.github/workflows/snappy-releases-gate.yml'); then
            printf 'suppression comment:\n%s\n' "${hits}" >&2
            status=1
          fi
          pins=(
            "rhysd/actionlint|# v${ACTIONLINT}"
            "zizmorcore/zizmor-pre-commit|# v${ZIZMOR}"
            "shellcheck-py/shellcheck-py|(ShellCheck ${SHELLCHECK})"
            "scop/pre-commit-shfmt|(shfmt ${SHFMT})"
            "gitleaks/gitleaks|# v${GITLEAKS}"
          )
          for pin in "${pins[@]}"; do
            repo="${pin%%|*}" version="${pin#*|}"
            if ! grep -A1 -F "repo: https://github.com/${repo}" \
              .pre-commit-config.yaml | grep -Fq "${version}"; then
              echo ".pre-commit-config.yaml does not pin ${repo} at '${version}'" >&2
              status=1
            fi
          done
          grep -Fq "mergify-cli==${MERGIFY_CLI}" .pre-commit-config.yaml || {
            echo ".pre-commit-config.yaml: mergify-cli==${MERGIFY_CLI}" >&2; status=1
          }
          exit "${status}"
      - name: Refs #N only (no GitHub closing keyword in the title, body or commits)
        if: >-
          github.event_name == 'pull_request'
          && !startsWith(github.head_ref, 'mergify/merge-queue/')
          && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          name='[[:alnum:]_.-]+'
          keyword="\\b(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]*"
          keyword+="((${name}/${name})?#[0-9]+|https://github[.]com/${name}/${name}/issues/[0-9]+)"
          status=0
          if hits=$(printf '%s\n%s\n' "${PR_TITLE}" "${PR_BODY}" | grep -Eio -- "${keyword}"); then
            printf 'pull request title or body:\n%s\n' "${hits}" >&2
            status=1
          fi
          mapfile -t commits < <(git rev-list "${BASE_SHA}..${HEAD_SHA}")
          for commit in "${commits[@]}"; do
            if hits=$(git log -1 --format=%B "${commit}" | grep -Eio -- "${keyword}"); then
              printf 'commit %s:\n%s\n' "${commit}" "${hits}" >&2
              status=1
            fi
          done
          ((status == 0)) || echo \
            'Use Refs #N instead of Closes, Fixes or Resolves #N.' >&2
          exit "${status}"
      - name: The commit hook's hand-roll check passes this tree
        run: uv tool run --from pre-commit==4.7.0 pre-commit run handroll-tree --all-files
      - name: actionlint (workflows)
        run: '"${RUNNER_TEMP}/tools/actionlint" -color -shellcheck "${RUNNER_TEMP}/tools/shellcheck"'
      - name: zizmor (snappy-swift G-40 threshold)
        run: |
          "${RUNNER_TEMP}/tools/zizmor" --offline --no-progress --no-config \
            --no-ignores --strict-collection --persona pedantic .
      - name: bash -n, ShellCheck --enable=all, shfmt -d
        run: |
          set -euo pipefail
          tools="${RUNNER_TEMP}/tools"
          mapfile -t files < <("${tools}/shfmt" -f .)
          ((${#files[@]} > 0)) || { echo 'no shell files found' >&2; exit 1; }
          status=0
          for f in "${files[@]}"; do
            printf '== %s\n' "${f}"
            bash -n "${f}" || status=1
          done
          "${tools}/shellcheck" --enable=all -x "${files[@]}" || status=1
          "${tools}/shfmt" -d "${files[@]}" || status=1
          exit "${status}"
      - name: gitleaks (tree and history)
        run: |
          "${RUNNER_TEMP}/tools/gitleaks" dir --redact --verbose .
          "${RUNNER_TEMP}/tools/gitleaks" git --redact --verbose .
      - name: mergify config validate
        run: |
          uv tool run --from "mergify-cli==${MERGIFY_CLI}" \
            mergify config validate -f .mergify.yml
      - name: jscpd 4.0.5 --threshold 0
        run: npx --yes jscpd@4.0.5 --threshold 0 --silent --gitignore .
      - name: STE100 linter (every Markdown file)
        run: |
          set -euo pipefail
          mapfile -t docs < <(git ls-files '*.md')
          python3 -I "${RUNNER_TEMP}/tools/ste-lint.py" "${docs[@]}"
