name: snappy-releases-gate
# The gate of roboulos/snappy-releases: the checks snappy-lanes-gate runs (actionlint, zizmor, bash -n, ShellCheck, shfmt,
# gitleaks, mergify config validate) at the same pins, zizmor at snappy-swift's threshold (scripts/gate/workflows.sh G-40:
# pedantic, no config file, no ignore comments), the STE100 linter on every Markdown file, the repository rules below, and
# a pull request names its issue with Refs #N only (no closing keyword in its title, body or commits).
# uv comes from astral-sh/setup-uv. The other tools publish no action that runs the same check, so each is its GitHub
# release asset at an exact version, checked against the SHA-256 GitHub publishes for it before it runs. The versions are
# set once, in env below, and must equal the revs .pre-commit-config.yaml pins (the "Repository rules" step checks it).
# GitHub-hosted runner: this repository is public, and GitHub's guidance is to use self-hosted runners with private
# repositories only (any fork can open a pull request here). Nothing heavy runs: lint and a file listing.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: snappy-releases-gate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  snappy-releases-gate:
    name: snappy-releases-gate
    # Ready pull requests, and the draft pull requests Mergify opens on its queue branches to test the merged result.
    if: github.event_name == 'push' || github.event.pull_request.draft == false || startsWith(github.head_ref, 'mergify/merge-queue/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ACTIONLINT: 1.7.12
      SHELLCHECK: 0.11.0
      SHFMT: 3.14.1
      ZIZMOR: 1.32.0
      GITLEAKS: 8.30.1
      MERGIFY_CLI: 2026.11.17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: 0.13.9
          checksum: a7fbaff2b9a271d85c1bdb540941090fd1ce011797b4abeb48e4dcd39c2471d5
          enable-cache: false
      - name: Tools (published releases, SHA-256 checked)
        run: |
          set -euo pipefail
          tools="${RUNNER_TEMP}/tools"
          mkdir -p "${tools}"
          fetch() {
            curl -fsSL --retry 3 -o "${tools}/$3" "$1"
            echo "$2  ${tools}/$3" | sha256sum -c -
          }
          fetch "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT}/actionlint_${ACTIONLINT}_linux_amd64.tar.gz" \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 actionlint.tar.gz
          tar -xzf "${tools}/actionlint.tar.gz" -C "${tools}" actionlint
          fetch "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK}/shellcheck-v${SHELLCHECK}.linux.x86_64.tar.xz" \
            8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 shellcheck.tar.xz
          tar -xJf "${tools}/shellcheck.tar.xz" -C "${tools}" --strip-components=1 "shellcheck-v${SHELLCHECK}/shellcheck"
          fetch "https://github.com/mvdan/sh/releases/download/v${SHFMT}/shfmt_v${SHFMT}_linux_amd64" \
            76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf shfmt
          chmod +x "${tools}/shfmt"
          fetch "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR}/zizmor-x86_64-unknown-linux-gnu.tar.gz" \
            bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b zizmor.tar.gz
          tar -xzf "${tools}/zizmor.tar.gz" -C "${tools}" zizmor
          fetch "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS}/gitleaks_${GITLEAKS}_linux_x64.tar.gz" \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb gitleaks.tar.gz
          tar -xzf "${tools}/gitleaks.tar.gz" -C "${tools}" gitleaks
          # The ASD-STE100 linter (github.com/danyuchn/asd-ste100-skill, scripts/ste-lint.py) at a fixed commit.
          fetch https://raw.githubusercontent.com/danyuchn/asd-ste100-skill/65c8ab6ef5fcb3619c8e6daca43e68627f3d7b4a/scripts/ste-lint.py \
            66c454b94dea0f81334f36b222775b62b6ec24e25c0e62308f23c550ef3eaa3d ste-lint.py
      - name: Repository rules
        # 1. Release files only (README.md): the app's code lives in its source repository, and a release is published by
        #    snappy-swift's snappy-release workflow. Any other tracked path fails, so no code, script, Worker, binary,
        #    linter config (snappy-swift G-40) or split copy (snappy-rust part-file) can sit here outside every gate (the
        #    download.snappy.ai Worker was such a file, 22 Nov 2026).
        # 2. No tracked file over 800 lines (snappy-rust module-lines, snappy-kernel file-lines).
        # 3. No suppression: no shellcheck directive, gitleaks:allow or zizmor ignore comment (snappy-rust suppression,
        #    snappy-swift R569). This file names the patterns, so it is the one file not searched.
        # 4. Each tool version in env above equals the rev comment .pre-commit-config.yaml pins for it.
        run: |
          set -euo pipefail
          status=0
          allowed='^(README[.]md|[.]mergify[.]yml|[.]pre-commit-config[.]yaml|[.]shellcheckrc|[.]githooks/pre-commit|[.]github/dependabot[.]yml|[.]github/workflows/[a-z-]+[.]yml)$'
          if extra=$(git ls-files | grep -Ev "${allowed}"); then
            printf 'not a release file (code belongs in its source repository):\n%s\n' "${extra}" >&2
            status=1
          fi
          while IFS= read -r -d '' f; do
            lines=$(wc -l < "${f}")
            ((lines <= 800)) || { echo "${f}: ${lines} lines, over 800" >&2; status=1; }
          done < <(git ls-files -z)
          if hits=$(git grep -n -I -E '#[[:space:]]*shellcheck[[:space:]]+[a-z]+=|gitleaks:allow|zizmor:[[:space:]]*ignore' -- . ':!.github/workflows/snappy-releases-gate.yml'); then
            printf 'suppression comment:\n%s\n' "${hits}" >&2
            status=1
          fi
          pins=(
            "rhysd/actionlint|# v${ACTIONLINT}"
            "zizmorcore/zizmor-pre-commit|# v${ZIZMOR}"
            "shellcheck-py/shellcheck-py|(ShellCheck ${SHELLCHECK})"
            "scop/pre-commit-shfmt|(shfmt ${SHFMT})"
            "gitleaks/gitleaks|# v${GITLEAKS}"
          )
          for pin in "${pins[@]}"; do
            repo="${pin%%|*}" version="${pin#*|}"
            if ! grep -A1 -F "repo: https://github.com/${repo}" .pre-commit-config.yaml | grep -Fq "${version}"; then
              echo ".pre-commit-config.yaml does not pin ${repo} at '${version}', the version this gate runs" >&2
              status=1
            fi
          done
          grep -Fq "mergify-cli==${MERGIFY_CLI}" .pre-commit-config.yaml || { echo ".pre-commit-config.yaml does not pin mergify-cli==${MERGIFY_CLI}" >&2; status=1; }
          exit "${status}"
      - name: Refs #N only (no GitHub closing keyword in the title, body or commits)
        # GitHub closes an issue when a pull request whose title, body or commit names it with a closing keyword merges.
        # That is before the release is built, notarized and checked live on a Mac (roboulos/snappy-releases#13).
        # The grammar is GitHub's: close, closes, closed, fix, fixes, fixed, resolve, resolves, resolved, then #N,
        # owner/repo#N or an issue URL. Mergify's merge queue drafts carry its own body and the commits already checked
        # here. Dependabot names upstream issues only. The "Refs only" merge protection in .mergify.yml re-reads an edited body.
        if: >-
          github.event_name == 'pull_request' && !startsWith(github.head_ref, 'mergify/merge-queue/') &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          name='[[:alnum:]_.-]+'
          keyword="\\b(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]*((${name}/${name})?#[0-9]+|https://github[.]com/${name}/${name}/issues/[0-9]+)"
          status=0
          if hits=$(printf '%s\n%s\n' "${PR_TITLE}" "${PR_BODY}" | grep -Eio -- "${keyword}"); then
            printf 'pull request title or body:\n%s\n' "${hits}" >&2
            status=1
          fi
          mapfile -t commits < <(git rev-list "${BASE_SHA}..${HEAD_SHA}")
          for commit in "${commits[@]}"; do
            if hits=$(git log -1 --format=%B "${commit}" | grep -Eio -- "${keyword}"); then
              printf 'commit %s:\n%s\n' "${commit}" "${hits}" >&2
              status=1
            fi
          done
          ((status == 0)) || echo 'Use Refs #N instead of Closes, Fixes or Resolves #N: an issue closes once its release is checked live.' >&2
          exit "${status}"
      - name: The commit hook's hand-roll check passes this tree (.pre-commit-config.yaml)
        run: uv tool run --from pre-commit==4.7.0 pre-commit run handroll-tree --all-files
      - name: actionlint (workflows)
        run: '"${RUNNER_TEMP}/tools/actionlint" -color -shellcheck "${RUNNER_TEMP}/tools/shellcheck"'
      - name: zizmor (snappy-swift G-40 threshold; uses pinned at full commit SHAs)
        run: '"${RUNNER_TEMP}/tools/zizmor" --offline --no-progress --no-config --no-ignores --strict-collection --persona pedantic .'
      - name: bash -n, ShellCheck --enable=all, shfmt -d
        run: |
          set -euo pipefail
          tools="${RUNNER_TEMP}/tools"
          mapfile -t files < <("${tools}/shfmt" -f .)
          ((${#files[@]} > 0)) || { echo 'no shell files found' >&2; exit 1; }
          status=0
          for f in "${files[@]}"; do
            printf '== %s\n' "${f}"
            bash -n "${f}" || status=1
          done
          "${tools}/shellcheck" --enable=all -x "${files[@]}" || status=1
          "${tools}/shfmt" -d "${files[@]}" || status=1
          exit "${status}"
      - name: gitleaks (tree and history)
        run: |
          "${RUNNER_TEMP}/tools/gitleaks" dir --redact --verbose .
          "${RUNNER_TEMP}/tools/gitleaks" git --redact --verbose .
      - name: mergify config validate
        run: 'uv tool run --from "mergify-cli==${MERGIFY_CLI}" mergify config validate -f .mergify.yml'
      - name: jscpd 4.0.5 --threshold 0 (snappy-runner's clone detector)
        run: npx --yes jscpd@4.0.5 --threshold 0 --silent --gitignore .
      - name: STE100 linter (every Markdown file)
        run: |
          set -euo pipefail
          mapfile -t docs < <(git ls-files '*.md')
          python3 -I "${RUNNER_TEMP}/tools/ste-lint.py" "${docs[@]}"
