version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # A release is not proposed until it is 7 days old (zizmor dependabot-cooldown).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels: ["dependencies"]
    groups:
      actions:
        patterns: ["*"]
  # The hook revs of .pre-commit-config.yaml. A bump must move the matching version in snappy-releases-gate.yml too: the
  # gate's "Repository rules" step fails until both agree.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels: ["dependencies"]
    groups:
      hooks:
        patterns: ["*"]
